{%- assign today = site.time | date: "%Y%m%d" | plus: 0 -%}
{%- if today <= 20261011 -%}
<style>
  .deardk { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; align-items: center; gap: .6rem;
    padding: .6rem 1rem calc(.6rem + env(safe-area-inset-bottom, 0px)); font-size: 90%; line-height: 1.4;
    background: #d02d6b; color: #fff; box-shadow: 0 -6px 18px rgba(80, 10, 40, .18); }
  .deardk::before { content: ""; position: absolute; left: 0; right: 0; top: -6px; height: 6px;
    background: repeating-linear-gradient(-45deg, #d02d6b 0 8px, #a81f52 8px 16px); }
  .deardk[hidden] { display: none; }
  .deardk a { flex: 1; max-width: 60rem; margin: auto; color: inherit; text-decoration: none; }
  .deardk b { display: inline-block; margin-left: .4rem; padding: 0 .6rem; border-radius: 1rem; background: #fff; color: #d02d6b; white-space: nowrap; }
  .deardk button { border: 0; background: none; color: inherit; font-size: 1.4em; line-height: 1; padding: 0 .3rem; cursor: pointer; }
  body:has(.deardk:not([hidden])) { padding-bottom: 6rem; }
</style>
<div class="deardk noprint" role="region" aria-label="Protest notice">
  <a href="https://www.deardk.com/?ref=blr.today">More flyovers won't fix Bengaluru traffic. Join the human chain against the elevated corridors at KFC Signal, Indiranagar, Sun 11&nbsp;Oct, 11&nbsp;am. <b>Why →</b></a>
  <button type="button" aria-label="Dismiss" onclick="this.parentNode.hidden = true">×</button>
</div>
{%- endif -%}
