[build]

publish = "_site"
command = """
set -e
npm run fetch-calendar
npm run fetch-social
npm run build
bundle exec jekyll build --trace
npm test
event_count=$(grep total_events_count _site/metrics  | cut -d ' ' -f 2)
if [ -z "$event_count" ] || [ "$event_count" -eq "0" ]; then
  echo "No events found, exiting with error.";
  exit 1
fi
"""

# Short thumbnail paths, cached for a year in browsers and the shared durable cache
[[redirects]]
  from = "/img/600/*"
  to = "/.netlify/images?url=https://:splat&w=600"
  status = 200

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Netlify-CDN-Cache-Control = "public, durable, s-maxage=31536000"
    Netlify-Cache-ID = "thumbs"

# Keep in sync with _data/image_cdn.yml, test/image-cdn.test.js checks this
