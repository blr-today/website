title: BLR.today
description: >- # this means to ignore newlines until "baseurl:"
  Semi-curated event listings for Bangalore
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://blr.today" # the base hostname & protocol for your site, e.g. http://example.com
# jekyll serve rewrites url to localhost, but subscriptions need the public https feed
feed_url: "https://blr.today"
plugins:
  - jekyll_sqlite
  - jekyll-datapage-generator
  - jekyll-sitemap

include:
  - _headers
  - _redirects
exclude:
  - .editorconfig
  - .gitignore
  - Gemfile*
  - vendor
  - .jekyll-cache
  - rollup.config.js
  - package*
  - js # this is built into assets/js/
  - netlify.toml
  - README.md
  - events.db
  # TODO: fixme
  - default.ics
  - node_modules
  - test
  - scripts
  - netlify
  # SES has no production access yet, so no email sign-up
  - pages/subscribe.html
timezone: Asia/Kolkata
# Shared by every calendar, and event pages with these tags stay out of the sitemap
excludeTags: &excludeTags '["BUSINESS", "LOW-QUALITY", "NOTINBLR", "DANDIYA", "WOOWOO", "SPORTS-SCREENING"]'
collections:
  event:
    output: true
defaults:
  - scope:
      path: "cal/*.md"
    values:
      layout: events
      permalink: /:path/:basename/
      subscribe: true
      domain: ""
      excludeTags: *excludeTags
      layouts:
        - layout: icalendar.ics
          permalink: /:path/:basename/cal.ics
        # - layout: agenda.rss
        #   permalink: /:path/:basename/agenda.xml
      sqlite:
        - data: events
          file: events.db
          query: |
            WITH 
            allowlist_tags AS (
              SELECT value FROM json_each(:tags)
            ),
            denylist_tags AS (
              SELECT value FROM json_each(:excludeTags)
            )
            SELECT url, id,
              -- Merged events link to the copy on this calendar's domain, if any
              coalesce((
                SELECT json_set(event_json, '$.url', same_as.value)
                FROM json_each(event_json->'$.sameAs') AS same_as
                WHERE :domain != '' AND (
                  same_as.value LIKE '%://' || :domain || '/%'
                  OR same_as.value LIKE '%.' || :domain || '/%'
                )
                LIMIT 1
              ), event_json) AS event_json
            FROM events
            WHERE
              -- Check if no denylist tags are present
              NOT EXISTS (
                SELECT 1
                FROM denylist_tags
                WHERE denylist_tags.value IN (
                  SELECT value
                  FROM json_each(event_json->'$.keywords')
                )
              )
              AND
              -- Check if at least one allowlist tag is present
              EXISTS (
                SELECT 1
                FROM allowlist_tags
                WHERE allowlist_tags.value IN (
                  SELECT value
                  FROM json_each(event_json->'$.keywords')
                )
              )
            ORDER BY event_json -> '$.startDate';
sqlite:
  # ingest's src/event_ids.py fills events.id
  - collection: event
    file: events.db
    query: |
      SELECT id AS name, 'event' AS layout, '/event/' || id || '/' AS permalink,
        (event_json ->> '$.name') || ' | blr.today' AS title, url AS source, event_json
      FROM events
  - data: metrics
    file: events.db
    query: "SELECT COUNT(*) as total FROM events"
  - data: all_events
    file: events.db
    query: "SELECT event_json FROM events ORDER BY event_json -> '$.startDate'"
